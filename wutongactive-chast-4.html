<title>Лукбук — WutongActive — часть 4</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F5F4; --panel:#FFFFFF; --ink:#16211C; --muted:#5D6F66; --line:#DCE5E0;
  --accent:#2F6B4F; --accent-soft:#E4EFE8; --star:#C98A23; --heart:#C2452F; --shadow:0 1px 2px rgba(22,33,28,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111714; --panel:#19211D; --ink:#E7EFE9; --muted:#9FB2A8; --line:#2A342E;
    --accent:#7FC0A0; --accent-soft:#22332B; --star:#E0A94A; --heart:#E2735C; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#111714; --panel:#19211D; --ink:#E7EFE9; --muted:#9FB2A8; --line:#2A342E;
  --accent:#7FC0A0; --accent-soft:#22332B; --star:#E0A94A; --heart:#E2735C; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Golos Text",-apple-system,"Helvetica Neue",Arial,sans-serif}
.wrap{padding:0 16px 64px;max-width:1400px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px 10px}
.brow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline}
h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:13px}
.sub a{color:var(--accent)}
.prog{flex:1;min-width:160px;height:6px;border-radius:99px;background:var(--line);overflow:hidden;align-self:center}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
select,input[type=search]{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,215px),1fr));gap:14px;margin-top:16px}
.card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.card.liked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ph{position:relative;aspect-ratio:3/4;overflow:hidden;background:#fff;cursor:zoom-in}
.ph img{position:absolute;top:0;left:0;height:100%;width:auto;max-width:none;transition:transform .15s}
.dots{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:4px}
.dots b{width:5px;height:5px;border-radius:99px;background:rgba(22,33,28,.25)}
.dots b.on{background:var(--accent)}
.meta{min-width:0;overflow-wrap:anywhere;padding:8px 10px 0;display:flex;flex-direction:column;gap:3px;flex:1}
.type{font-size:12px;font-weight:600;color:var(--accent);text-transform:lowercase}
.art{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--muted);word-break:break-all}
.fab{font-size:11.5px;color:var(--muted);line-height:1.35}
.price{font-size:13px;font-weight:600}
.acts{display:flex;align-items:center;gap:6px;padding:8px 10px 10px;border-top:1px solid var(--line);margin-top:8px}
.heart,.star{background:none;border:0;padding:2px;cursor:pointer;font-size:16px;line-height:1;color:var(--muted)}
.heart.on{color:var(--heart)}
.stars{display:flex;gap:1px;margin-left:auto}
.star.on{color:var(--star)}
.others{font-size:11px;color:var(--muted)}
.empty{padding:40px 0;color:var(--muted);text-align:center}
.status{font-size:12px;color:var(--muted);margin-top:6px}
.send{margin-top:8px;align-items:center}
.send a.chip{text-decoration:none}
#who{min-width:150px}
dialog{border:0;border-radius:14px;padding:0;margin:auto;background:var(--panel);color:var(--ink);max-width:min(94vw,900px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,16,13,.7)}
.viewer{position:relative;overflow:hidden;width:min(92vw,620px);aspect-ratio:3/4;background:#fff;touch-action:pan-y}
.viewer img{position:absolute;top:0;left:0;height:100%;width:auto;max-width:none;transition:transform .18s;cursor:zoom-in}
.nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(22,33,28,.45);color:#fff;font-size:26px;line-height:1;width:42px;height:56px;cursor:pointer;border-radius:6px}
.nav.prev{left:6px} .nav.next{right:6px}
.dots.big{bottom:10px}
.dots.big b{width:8px;height:8px;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(22,33,28,.25)}
.dots.big b.on{background:var(--accent)}
.dlgbar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
button:focus-visible,.chip:focus-visible,.ph:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* телефон: две крупные колонки вместо мелкой сетки, крупнее текст и кнопки */
@media (max-width:760px){
  body{font-size:16px}
  .wrap{padding:0 12px 72px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  h1{font-size:21px}
  .type{font-size:14px}
  .art{font-size:12.5px}
  .fab{font-size:13px}
  .price{font-size:15px}
  .meta{padding:10px 12px 0;gap:4px}
  .acts{padding:10px 12px 12px;gap:8px}
  .heart,.star{font-size:23px;padding:4px 2px}
  .stars{gap:3px}
  .chip,select,input[type=search]{font-size:15px;padding:9px 14px}
  #who{min-width:130px}
  .viewer{width:96vw}
  .nav{width:52px;height:68px;font-size:30px}
}
@media (max-width:430px){
  .grid{grid-template-columns:minmax(0,1fr);gap:14px}
  .heart,.star{font-size:26px;padding:6px 3px}
}
</style>
<div class="wrap">
<header class="top">
  <div class="brow">
    <h1>WutongActive — часть 4</h1>
    <div class="sub">106 моделей · каталоги фабрики</div>
    <div class="prog" aria-hidden="true"><i id="bar"></i></div>

  <div class="tools">

  <div class="tools send">
    <a class="chip" href="index.html">← Все фабрики</a>
    <input id="who" placeholder="ваше имя" autocomplete="name">
    <button class="chip" id="copy">Скопировать выбор</button>
    <button class="chip" id="dl">Скачать файл выбора</button>
    <button class="chip" id="send">Отправить Софье</button>
  </div>
</header>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden>Ничего не найдено — снимите фильтры.</div>
</div>
<dialog id="dlg">
  <div class="viewer" id="viewer">
    <img id="bigimg" alt="">
    <button class="nav prev" id="prev" aria-label="Предыдущее фото">‹</button>
    <button class="nav next" id="next" aria-label="Следующее фото">›</button>
    <div class="dots big" id="bigdots"></div>
  </div>
  <div class="dlgbar"><span class="sub" id="dlgcap"></span><span class="sub" id="dlgnum"></span><button class="chip" id="dlgclose" style="margin-left:auto">Закрыть</button></div>
</dialog>

function localLoad(){ try{ return JSON.parse(localStorage.getItem("votes:"+PAGE_ID)||"{}"); }catch(e){ return {}; } }
function localSave(){ try{ localStorage.setItem("votes:"+PAGE_ID, JSON.stringify(state.mine)); }catch(e){} }

function render(){
  const grid = document.getElementById("grid");
  grid.textContent = "";
  const q = state.q.trim().toLowerCase();
  let shown = 0;
  for(const m of MODELS){
    const v = state.mine[m.id] || {};
    if(state.filter==="new" && (v.like || v.stars)) continue;
    if(state.filter==="like" && !v.like) continue;
    if(state.type && m.type !== state.type) continue;
    if(q && !((m.item_no+" "+m.fabric+" "+m.description).toLowerCase().includes(q))) continue;
    grid.appendChild(card(m, v)); shown++;
  }
  document.getElementById("empty").hidden = shown>0;
  const rated = MODELS.filter(m=>{const v=state.mine[m.id]||{}; return v.like||v.stars;}).length;
  document.getElementById("bar").style.width = (100*rated/MODELS.length).toFixed(1)+"%";
  document.getElementById("cnt").textContent = `оценено ${rated} из ${MODELS.length}`;
}

function card(m, v){
  const c = el("div","card"+(v.like?" liked":""));
  const ph = el("div","ph"); ph.tabIndex = 0;
  const img = el("img"); img.loading="lazy"; img.alt=m.type+" "+(m.item_no||"");
  img.src = m.web; img.style.width = (m.frames*100)+"%";
  const dots = el("div","dots");
  for(let i=0;i<m.frames;i++){ const b=el("b"); if(i===0)b.className="on"; dots.appendChild(b); }
  ph.addEventListener("click", ()=> openBig(m));
  ph.addEventListener("keydown", e=>{ if(e.key==="Enter" || e.key===" ") { e.preventDefault(); openBig(m); } });
  ph.append(img, dots);
  const meta = el("div","meta");
  meta.appendChild(el("div","type", m.type));
  if(m.item_no) meta.appendChild(el("div","art", m.item_no));
  if(m.fabric) meta.appendChild(el("div","fab", m.fabric));
  if(m.price) meta.appendChild(el("div","price", m.price));
  const acts = el("div","acts");
  const heart = el("button","heart"+(v.like?" on":""),"♥");
  heart.title = "Нравится"; heart.setAttribute("aria-pressed", v.like?"true":"false");
  heart.onclick = ()=> save(m, {like: !(state.mine[m.id]||{}).like});
  acts.appendChild(heart);
  const others = state.others[m.id]||0;
  if(others) acts.appendChild(el("span","others","+"+others));
  const stars = el("div","stars");
  for(let i=1;i<=5;i++){
    const s = el("button","star"+((v.stars||0)>=i?" on":""),"★");
    s.title = i+" из 5";
    s.onclick = ()=> save(m, {stars: (state.mine[m.id]||{}).stars===i ? 0 : i});
    stars.appendChild(s);
  }
  acts.appendChild(stars);
  c.append(ph, meta, acts);
  return c;
}

let view = {m:null, frame:0};
function showFrame(){
  const {m, frame} = view;
  const img = document.getElementById("bigimg");
  img.style.width = (m.frames*100)+"%";
  img.style.transform = `translateX(${-frame*(100/m.frames)}%)`;
  const dots = document.getElementById("bigdots");
  dots.textContent = "";
  for(let i=0;i<m.frames;i++){ const b=el("b"); if(i===frame) b.className="on"; dots.appendChild(b); }
  dots.hidden = m.frames < 2;
  document.getElementById("dlgnum").textContent = m.frames>1 ? `фото ${frame+1} из ${m.frames}` : "";
  for(const id of ["prev","next"]) document.getElementById(id).hidden = m.frames < 2;
}
function step(d){ view.frame = (view.frame + d + view.m.frames) % view.m.frames; showFrame(); }
function openBig(m){
  view = {m, frame:0};
  const img = document.getElementById("bigimg");
  img.src = m.web;
  document.getElementById("dlgcap").textContent = [m.factory, m.type, m.item_no, m.fabric, m.price].filter(Boolean).join(" · ");
  showFrame();
  document.getElementById("dlg").showModal();
}
document.getElementById("dlgclose").onclick = ()=> document.getElementById("dlg").close();
document.getElementById("dlg").addEventListener("click", e => { if(e.target.id === "dlg") document.getElementById("dlg").close(); });
document.getElementById("prev").onclick = e => { e.stopPropagation(); step(-1); };
document.getElementById("next").onclick = e => { e.stopPropagation(); step(1); };
document.getElementById("bigimg").onclick = ()=> { if(view.m && view.m.frames>1) step(1); };
document.addEventListener("keydown", e=>{
  if(!document.getElementById("dlg").open || !view.m) return;
  if(e.key==="ArrowRight") step(1);
  if(e.key==="ArrowLeft") step(-1);
});
let touchX = null;
const viewer = document.getElementById("viewer");
viewer.addEventListener("touchstart", e => { touchX = e.changedTouches[0].clientX; }, {passive:true});
viewer.addEventListener("touchend", e => {
  if(touchX === null || !view.m) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if(Math.abs(dx) > 40) step(dx < 0 ? 1 : -1);
}, {passive:true});

async function save(m, patch){
  const cur = state.mine[m.id] || {like:false, stars:0};
  const next = Object.assign({}, cur, patch);
  state.mine[m.id] = next; localSave(); render();
  if(!db) return;
  try{
    await db.doc("votes/"+key(m.id)).set({
      model:m.id, page:PAGE_ID, factory:m.factory, type:m.type, item_no:m.item_no||"",
      like: !!next.like, stars: next.stars||0, by: uid||"", at: new Date().toISOString()
    });
  }catch(e){
    document.getElementById("status").textContent = "Оценка сохранена только на этом устройстве: "+(e.code||e.message||"нет доступа к общей базе");
  }
}

function picked(){
  const out = [];
  for(const m of MODELS){
    const v = state.mine[m.id]; if(!v || (!v.like && !v.stars)) continue;
    out.push({id:m.id, factory:m.factory, type:m.type, item:m.item_no||"", like:!!v.like, stars:v.stars||0});
  }
  return {page:PAGE_ID, who:(document.getElementById("who").value||"").trim(), at:new Date().toISOString(), picks:out};
}
document.getElementById("who").value = localStorage.getItem("who")||"";
document.getElementById("who").oninput = e => { try{ localStorage.setItem("who", e.target.value); }catch(err){} };
document.getElementById("copy").onclick = async ()=>{
  const data = picked();
  try{ await navigator.clipboard.writeText(JSON.stringify(data));
       document.getElementById("status").textContent = `Скопировано: ${data.picks.length} моделей. Вставьте текст в сообщение Софии.`; }
  catch(e){ document.getElementById("status").textContent = "Не удалось скопировать — воспользуйтесь кнопкой «Скачать файл выбора»."; }
};
document.getElementById("dl").onclick = ()=>{
  const data = picked();
  const blob = new Blob([JSON.stringify(data, null, 1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `выбор-wutongactive-chast-4-${data.who||"без-имени"}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  document.getElementById("status").textContent = `Файл сохранён: ${data.picks.length} моделей.`;
};
const SEND_URL = "https://formsubmit.co/ajax/privery.prod@euphoria.fit";
document.getElementById("send").onclick = async () => {
  const data = picked();
  const st = document.getElementById("status");
  if(!data.picks.length){ st.textContent = "Пока ничего не отмечено — поставьте сердце или звёзды."; return; }
  const body = (data.who ? data.who + "\n\n" : "") +
    data.picks.map(p=>`${p.factory} · ${p.type}${p.item ? " " + p.item : ""} — ${p.like ? "нравится" : ""}${p.stars ? " " + p.stars + "/5" : ""}`).join("\n");
  const lines = data.picks.map(p =>
    `- ${p.id} · ${p.factory} · ${p.type}${p.item ? " · " + p.item : ""}${p.like ? " · нравится" : ""}${p.stars ? " · " + p.stars + "/5" : ""}`);
  const text = `Страница: wutongactive-chast-4\nКто отмечал: ${data.who || "не указано"}\nОтмечено моделей: ${data.picks.length}\n\n` + lines.join("\n");
  const btn = document.getElementById("send");
  btn.disabled = true;
  st.textContent = "Отправляю…";
  try{
    const res = await fetch(SEND_URL, {
      method: "POST",
      headers: {"Content-Type": "application/json", "Accept": "application/json"},
      body: JSON.stringify({
        _subject: `Выбор моделей: ${data.who || "без имени"} — wutongactive-chast-4`,
        _template: "table",
        Кто: data.who || "не указано",
        Страница: PAGE_ID,
        Моделей: String(data.picks.length),
        Выбор: text
      })
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    st.textContent = `Отправлено Софье: ${data.picks.length} моделей. Спасибо!`;
    try{ localStorage.setItem("sent:" + PAGE_ID, new Date().toISOString()); }catch(e){}
  }catch(e){
    try{
      await navigator.clipboard.writeText(text);
      st.textContent = "Не удалось отправить (нет сети?) — выбор скопирован в буфер, пришлите его Софье сообщением.";
    }catch(err){
      st.textContent = "Не удалось отправить — нажмите «Скачать файл выбора» и пришлите файл.";
    }
  }finally{ btn.disabled = false; }
};

document.getElementById("f-all").onclick = ()=> setFilter("all");
document.getElementById("f-new").onclick = ()=> setFilter("new");
document.getElementById("f-like").onclick = ()=> setFilter("like");
function setFilter(f){
  state.filter=f;
  for(const [id,val] of [["f-all","all"],["f-new","new"],["f-like","like"]])
    document.getElementById(id).setAttribute("aria-pressed", String(val===f));
  render();
}
const types = [...new Set(MODELS.map(m=>m.type))].sort();
const sel = document.getElementById("f-type");
for(const t of types){ const o=el("option",null,t); o.value=t; sel.appendChild(o); }
sel.onchange = e => { state.type = e.target.value; render(); };
document.getElementById("f-q").oninput = e => { state.q = e.target.value; render(); };

state.mine = localLoad();
render();

(async ()=>{
  const user = await window.claude?.use?.("user");
  uid = user ? await user.id() : null;
  db = await window.claude?.use?.("db");
  if(!db){ document.getElementById("status").textContent = "Общая база недоступна — оценки сохраняются только в этом браузере."; return; }
  document.getElementById("status").textContent = "Оценки сохраняются автоматически и видны коллегам.";
  db.collection("votes").where("page","==",PAGE_ID).onSnapshot(snap=>{
    const mine={}, others={};
    for(const d of snap.docs){
      const v = d.data()||{};
      if(uid && v.by===uid){ mine[v.model]={like:!!v.like, stars:v.stars||0}; }
      else if(v.like){ others[v.model]=(others[v.model]||0)+1; }
    }
    if(Object.keys(mine).length || Object.keys(others).length){
      state.mine = Object.keys(mine).length ? mine : state.mine;
      state.others = others; localSave(); render();
    }
  }, err => { document.getElementById("status").textContent = "Общая база не отвечает ("+(err.code||"ошибка")+") — оценки пока только в этом браузере."; });
})();
</script>
