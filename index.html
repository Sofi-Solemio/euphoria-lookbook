<title>Лукбук фабрик</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F2F5F4;--panel:#fff;--ink:#16211C;--muted:#5D6F66;--line:#DCE5E0;--accent:#2F6B4F}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111714;--panel:#19211D;--ink:#E7EFE9;--muted:#9FB2A8;--line:#2A342E;--accent:#7FC0A0}}
:root[data-theme="dark"]{--bg:#111714;--panel:#19211D;--ink:#E7EFE9;--muted:#9FB2A8;--line:#2A342E;--accent:#7FC0A0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Golos Text",-apple-system,Arial,sans-serif}
.w{max-width:980px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.3px}
.lead{color:var(--muted);margin:0 0 14px}
.link{display:block;background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:14px 16px;margin-bottom:18px;text-decoration:none;color:inherit}
.link b{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.p{display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:inherit}
.p:hover{border-color:var(--accent)}
.n{font-weight:600} .c{color:var(--accent);font-weight:600;font-size:13px} .t{color:var(--muted);font-size:12.5px}
.how{margin-top:24px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:14px}
.how b{display:block;margin-bottom:6px} .how li{margin:3px 0;color:var(--muted)}
.new{background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:2px 7px;margin-left:6px;vertical-align:1px}
.st{font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.st.partner{background:#2F6B4F;color:#fff}.p.s-partner{border-left:5px solid #2F6B4F;background:#F1F8F4}
.st.sample{background:#DDF3E4;color:#12683A}.st.contact{background:#E1ECFA;color:#1F4E9A}.st.closed{background:#ECEEF0;color:#6B7480}.st.price{background:#FFF0C2;color:#7A5200}.st.rrc{background:#FFE9A8;color:#7A5200;box-shadow:inset 0 0 0 1px #E8B931}
.p.s-sample{border-left:5px solid #2E9E5B}.p.s-contact{border-left:5px solid #3D7BD9}.p.s-closed{opacity:.6;border-left:5px solid #B8BEC6}
.p.s-pick{border:2px solid var(--accent)}.g.picks{margin-bottom:18px}
.legend{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center;margin:0 0 14px;font-size:13px;color:var(--muted)}
</style>
